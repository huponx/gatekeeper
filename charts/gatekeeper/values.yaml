# Values of the go-application chart live under `application:` (alias of the dependency).
# image.tag is written at release time (update-deployment-values); the default only keeps `helm template` working.
#
# One gatekeeper release per environment: the shared gateway (api.example.com) that the web apps
# (example.com, dict.example.com, bill.example.com, ...) call from the browser, and mobile apps / services call
# with a Bearer token. mm-deploy sets the host, GATEKEEPER_UI_ORIGINS and the secrets.
#
# The routes are part of this chart (routes.yaml at the repo root, linked as files/routes.yaml, rendered into the ConfigMap gatekeeper-routes):
# one source for every environment. Only the upstream addresses are values, and optionally `insecure: false` per upstream
# (TLS to that upstream, CA from GRPC_TLS_CA_FILE) while the others stay plaintext.
routes:
  upstreams:
    identity: {target: "identity.application.svc.cluster.local:9090"}
    dictionary: {target: "dictionary.application.svc.cluster.local:9090"}
    courier: {target: "courier.application.svc.cluster.local:9090"}

application:
  deployment:
    # routes.yaml comes from the ConfigMap gatekeeper-routes that this chart renders
    # (templates/routes-configmap.yaml).
    volumes:
      - name: routes
        configMap:
          name: gatekeeper-routes
      # In-cluster gRPC TLS (certificate of cert-manager, see the TLS section of courier/docs/setup-notification.md).
      # Optional: the pod starts without it, nothing reads it until GRPC_TLS_* / *_INSECURE=false are set.
      - name: grpc-tls
        secret:
          secretName: identity-grpc-tls
          optional: true
          items:
            - key: ca.crt
              path: ca.crt
    container:
      image:
        repository: huponx/gatekeeper
        tag: "0.0.0"
      port: 8080
      envFrom:
        - configMapRef:
            name: '{{ include "common.name" . }}-env-vars'
      startupProbe:
        httpGet:
          path: /healthz
          port: 8080
        failureThreshold: 30
        periodSeconds: 2
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 20
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8080
        periodSeconds: 10
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 100m
          memory: 128Mi
      securityContext:
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
      volumeMounts:
        - name: routes
          mountPath: /etc/gatekeeper
          readOnly: true
        - name: grpc-tls
          mountPath: /var/run/tls
          readOnly: true
  serviceAccount:
    create: true
  service:
    enabled: true
    port: 8080
  config:
    data:
      HOST: "0.0.0.0"
      PORT: "8080"
      LOG_ENCODING: json
      GATEKEEPER_ROUTES_FILE: /etc/gatekeeper/routes.yaml
      # the CA trusted by the gRPC clients of this service; used only once a *_INSECURE variable is false
      GRPC_TLS_CA_FILE: /var/run/tls/ca.crt
  # Secret values stay out of git: reference existing Secrets (mm-deploy overrides this list).
  secrets: []
  ingress:
    enabled: false
    tls: true
  autoscaling:
    enabled: false
  pdb:
    enabled: false
