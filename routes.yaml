# NOTE: charts/gatekeeper/files/routes.yaml is a symlink to this file (helm reads files only inside the chart
# and packages the content of a linked file). Keep it a symlink, do not copy this file.
# Routes of the shared gateway (the admin web app towards identity). Single source of truth: the chart
# renders this file into the ConfigMap `gatekeeper-routes` (templates/routes-configmap.yaml), so a change
# here is validated by `go test ./internal/routes`, released with the gateway and deployed by the
# mm-deploy bump PR. Upstream addresses come from the chart values (`routes.upstreams`).
#
# Each `permission` is the one the identity method itself requires (identity/internal/service
# Permissions): the exchanged token carries the user's permissions, identity checks them again, and
# gatekeeper refuses early with 403.
#
# Request mapping: path parameters, query string and JSON body are merged into the gRPC request
# message (path wins), so `{user_id}` fills `user_id`. Gin needs one name per path position:
# every route under /api/users/ uses that name, so a user is read with GET /api/users/{user_id}
# (GetUserRequest has a `user_id` field for it) and found with GET /api/users?query=<email prefix>.
# PUT /api/users/{user_id}/avatar carries the picture as base64 JSON (at most 64 KiB decoded, the
# gateway accepts bodies up to 1 MiB).
routes:
  # roles
  - {http: "GET /api/roles", grpc: identity.v1.IdentityService/ListRoles, upstream: identity, permission: "identity:role:read"}
  - {http: "POST /api/roles", grpc: identity.v1.IdentityService/CreateRole, upstream: identity, permission: "identity:role:write"}
  - {http: "PUT /api/roles/{role}", grpc: identity.v1.IdentityService/UpdateRole, upstream: identity, permission: "identity:role:write"}
  - {http: "DELETE /api/roles/{role}", grpc: identity.v1.IdentityService/DeleteRole, upstream: identity, permission: "identity:role:write"}
  - {http: "PUT /api/roles/{role}/permissions", grpc: identity.v1.IdentityService/SetRolePermissions, upstream: identity, permission: "identity:role:write"}
  - {http: "GET /api/permissions", grpc: identity.v1.IdentityService/ListPermissions, upstream: identity, permission: "identity:permission:read"}
  - {http: "POST /api/permissions", grpc: identity.v1.IdentityService/CreatePermission, upstream: identity, permission: "identity:permission:write"}
  - {http: "PUT /api/permissions/{permission}", grpc: identity.v1.IdentityService/UpdatePermission, upstream: identity, permission: "identity:permission:write"}
  - {http: "DELETE /api/permissions/{permission}", grpc: identity.v1.IdentityService/DeletePermission, upstream: identity, permission: "identity:permission:write"}
  - {http: "POST /api/roles/{role}/assignments", grpc: identity.v1.IdentityService/AssignRole, upstream: identity, permission: "identity:role:write"}
  - {http: "DELETE /api/roles/{role}/assignments", grpc: identity.v1.IdentityService/RevokeRole, upstream: identity, permission: "identity:role:write"}
  # clients
  - {http: "GET /api/clients", grpc: identity.v1.IdentityService/ListClients, upstream: identity, permission: "identity:client:read"}
  - {http: "POST /api/clients", grpc: identity.v1.IdentityService/CreateClient, upstream: identity, permission: "identity:client:write"}
  - {http: "PUT /api/clients/{client_id}", grpc: identity.v1.IdentityService/UpdateClient, upstream: identity, permission: "identity:client:write"}
  - {http: "PUT /api/clients/{client_id}/disabled", grpc: identity.v1.IdentityService/SetClientDisabled, upstream: identity, permission: "identity:client:write"}
  - {http: "DELETE /api/clients/{client_id}", grpc: identity.v1.IdentityService/DeleteClient, upstream: identity, permission: "identity:client:write"}
  - {http: "POST /api/clients/{client_id}/rotate-secret", grpc: identity.v1.IdentityService/RotateClientSecret, upstream: identity, permission: "identity:client:write"}
  # token exchange policies
  - {http: "GET /api/exchange-policies", grpc: identity.v1.IdentityService/ListExchangePolicies, upstream: identity, permission: "identity:exchange:read"}
  - {http: "PUT /api/exchange-policies", grpc: identity.v1.IdentityService/SetExchangePolicy, upstream: identity, permission: "identity:exchange:write"}
  # users
  - {http: "GET /api/users", grpc: identity.v1.IdentityService/ListUsers, upstream: identity, permission: "identity:user:read"}
  - {http: "POST /api/users", grpc: identity.v1.IdentityService/CreateUser, upstream: identity, permission: "identity:user:write"}
  - {http: "GET /api/users/{user_id}", grpc: identity.v1.IdentityService/GetUser, upstream: identity, permission: "identity:user:read"}
  - {http: "PUT /api/users/{user_id}", grpc: identity.v1.IdentityService/UpdateUser, upstream: identity, permission: "identity:user:write"}
  - {http: "PUT /api/users/{user_id}/avatar", grpc: identity.v1.IdentityService/SetUserAvatar, upstream: identity, permission: "identity:user:write"}
  - {http: "POST /api/users/{user_id}/welcome", grpc: identity.v1.IdentityService/SendWelcome, upstream: identity, permission: "identity:user:write"}
  - {http: "PUT /api/users/{user_id}/disabled", grpc: identity.v1.IdentityService/SetUserDisabled, upstream: identity, permission: "identity:user:write"}
  - {http: "PUT /api/users/{user_id}/password", grpc: identity.v1.IdentityService/SetUserPassword, upstream: identity, permission: "identity:user:write"}
  - {http: "POST /api/users/{user_id}/password-reset", grpc: identity.v1.IdentityService/SendPasswordReset, upstream: identity, permission: "identity:user:write"}
  - {http: "GET /api/user-stats", grpc: identity.v1.IdentityService/GetUserStats, upstream: identity, permission: "identity:user:read"}
  # the signed-in user's own profile: any signed-in user, no permission (identity takes the user from the
  # token, never from the request; `public` means signed in, never anonymous)
  - {http: "GET /api/me", grpc: identity.v1.IdentityService/GetMe, upstream: identity, public: true}
  - {http: "PUT /api/me", grpc: identity.v1.IdentityService/UpdateMe, upstream: identity, public: true}
  - {http: "PUT /api/me/avatar", grpc: identity.v1.IdentityService/SetMyAvatar, upstream: identity, public: true}
  # MFA per user
  - {http: "GET /api/users/{user_id}/mfa", grpc: identity.v1.IdentityService/GetUserMFA, upstream: identity, permission: "identity:mfa:read"}
  - {http: "PUT /api/users/{user_id}/mfa", grpc: identity.v1.IdentityService/SetUserMFA, upstream: identity, permission: "identity:mfa:write"}
  - {http: "PUT /api/users/{user_id}/mfa/enforced", grpc: identity.v1.IdentityService/EnforceUserMFA, upstream: identity, permission: "identity:mfa:write"}
  - {http: "POST /api/users/{user_id}/mfa/reset", grpc: identity.v1.IdentityService/ResetUserMFA, upstream: identity, permission: "identity:mfa:write"}
  # dictionary (look words up, keep a list of saved words, export it as an Anki deck); the user is the
  # token's, never a field of the request. `{word}` is the only parameter name under /api/dictionary/.
  # POST /api/dictionary/export answers with the .apkg as base64 JSON (at most 3 MiB by default).
# POST /api/dictionary/export-link keeps the deck behind a random token for a few minutes and answers with
# the token; GET /api/dictionary/downloads/{token}.apkg is the only anonymous route: an Anki app fetches
# the link without cookies, so the token in the path is the authorization (one use, short life) and
# gatekeeper calls dictionary with its own service token. `download: true` answers with the file.
# `timeout: 40s` on the two exports: building a deck downloads the audio files (up to 20s) and the default
# deadline of the gRPC client is 5s.
  - {http: "GET /api/dictionary/words/{word}", grpc: dictionary.v1.DictionaryService/LookupWord, upstream: dictionary, permission: "dictionary:word:read"}
  - {http: "POST /api/dictionary/lookup", grpc: dictionary.v1.DictionaryService/LookupWords, upstream: dictionary, permission: "dictionary:word:read"}
  - {http: "GET /api/dictionary/saved", grpc: dictionary.v1.DictionaryService/ListSavedWords, upstream: dictionary, permission: "dictionary:word:read"}
  - {http: "POST /api/dictionary/saved", grpc: dictionary.v1.DictionaryService/SaveWord, upstream: dictionary, permission: "dictionary:word:write"}
  - {http: "DELETE /api/dictionary/saved/{word}", grpc: dictionary.v1.DictionaryService/DeleteSavedWord, upstream: dictionary, permission: "dictionary:word:write"}
  - {http: "POST /api/dictionary/export", grpc: dictionary.v1.DictionaryService/ExportAnki, upstream: dictionary, permission: "dictionary:word:write", timeout: 40s}
  - {http: "POST /api/dictionary/export-link", grpc: dictionary.v1.DictionaryService/CreateDeckLink, upstream: dictionary, permission: "dictionary:word:write", timeout: 40s}
  # settings: the whole system (administrators) and the preferences of the signed in user
  - {http: "GET /api/dictionary/settings", grpc: dictionary.v1.DictionaryService/GetSettings, upstream: dictionary, permission: "dictionary:settings:read"}
  - {http: "PUT /api/dictionary/settings", grpc: dictionary.v1.DictionaryService/UpdateSettings, upstream: dictionary, permission: "dictionary:settings:write"}
  - {http: "GET /api/dictionary/me/settings", grpc: dictionary.v1.DictionaryService/GetMySettings, upstream: dictionary, permission: "dictionary:word:read"}
  - {http: "PUT /api/dictionary/me/settings", grpc: dictionary.v1.DictionaryService/UpdateMySettings, upstream: dictionary, permission: "dictionary:word:read"}
  - {http: "GET /api/dictionary/downloads/{token}", grpc: dictionary.v1.DictionaryService/DownloadDeck, upstream: dictionary, anonymous: true, download: true}
